name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,image,model]"

      - name: Check repository boundaries
        run: python scripts/check_repository_hygiene.py

      - name: Lint Python
        run: ruff check Model Tokenizer scripts

      - name: Run Python tests
        run: python -m pytest -q Model/tests Tokenizer/tests

      - name: Build Python package
        run: python -m build
