name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,hf,image,model]"

      - name: Check repository boundaries
        run: python scripts/check_repository_hygiene.py

      - name: Lint Python
        run: ruff check Model Tokenizer scripts smoke_two_stage.py

      - name: Run Python tests
        run: python -m pytest -q Model/tests Tokenizer/tests

      - name: Build Python package
        run: python -m build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --check --manifest-path "Encoding Mapping/Cargo.toml"

      - name: Run Rust tests
        run: cargo test --locked --manifest-path "Encoding Mapping/Cargo.toml"
